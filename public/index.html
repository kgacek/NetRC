<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RC Car Control - Cloudflare SFU</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    #container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #f48120;
    }
    #video {
      width: 100%;
      max-width: 640px;
      background: #000;
      display: block;
      margin: 0 auto 20px;
    }
    #controls {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .control-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #f48120;
    }
    input[type="range"] {
      width: 100%;
    }
    button {
      background: #f48120;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-right: 10px;
    }
    button:hover {
      background: #d66d0f;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #status {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
    }
    .status-line {
      margin: 5px 0;
    }
    .connected { color: #4caf50; }
    .disconnected { color: #f44336; }
    .warning { color: #ff9800; }
    #config {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      background: #1a1a1a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>🚗 RC Car Control - Cloudflare SFU</h1>
    
    <div id="config">
      <h3>Cloudflare Realtime Configuration</h3>
      <div class="control-group">
        <label>App ID:</label>
        <input type="text" id="appId" placeholder="your-app-id">
      </div>
      <div class="control-group">
        <label>Session ID:</label>
        <input type="text" id="sessionId" placeholder="session-id-from-car">
      </div>
      <button id="connectBtn">Connect to Stream</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    
    <div id="controls">
      <h3>Controls</h3>
      <div class="control-group">
        <label>Throttle: <span id="throttleVal">0.0</span></label>
        <input type="range" id="throttle" min="-1" max="1" step="0.1" value="0">
      </div>
      <div class="control-group">
        <label>Steering: <span id="steerVal">0.0</span></label>
        <input type="range" id="steer" min="-1" max="1" step="0.1" value="0">
      </div>
      <button id="stopBtn">Emergency Stop</button>
    </div>

    <div id="status">
      <div class="status-line">Status: <span id="connStatus" class="disconnected">Disconnected</span></div>
      <div class="status-line">ICE: <span id="iceStatus">-</span></div>
      <div class="status-line">Data Channel: <span id="dcStatus">-</span></div>
      <div class="status-line">Last Control: <span id="lastControl">-</span></div>
    </div>
  </div>

  <script>
    // Cloudflare Realtime SFU client
    let pc = null;
    let dataChannel = null;
    let sessionId = null;
    let appId = null;

    const video = document.getElementById('video');
    const throttleInput = document.getElementById('throttle');
    const steerInput = document.getElementById('steer');
    const throttleVal = document.getElementById('throttleVal');
    const steerVal = document.getElementById('steerVal');
    const stopBtn = document.getElementById('stopBtn');
    const connectBtn = document.getElementById('connectBtn');
    const appIdInput = document.getElementById('appId');
    const sessionIdInput = document.getElementById('sessionId');

    // Status elements
    const connStatus = document.getElementById('connStatus');
    const iceStatus = document.getElementById('iceStatus');
    const dcStatus = document.getElementById('dcStatus');
    const lastControl = document.getElementById('lastControl');

    function log(msg) {
      console.log(`[${new Date().toLocaleTimeString()}] ${msg}`);
    }

    function updateStatus(element, text, className) {
      element.textContent = text;
      element.className = className;
    }

    async function connectToCloudflare() {
      appId = appIdInput.value.trim();
      sessionId = sessionIdInput.value.trim();

      if (!appId || !sessionId) {
        alert('Please enter both App ID and Session ID');
        return;
      }

      log('Connecting to Cloudflare SFU...');
      updateStatus(connStatus, 'Connecting...', 'warning');

      try {
        // Create RTCPeerConnection with relay-only policy
        const config = {
          iceServers: [
            { urls: 'stun:stun.cloudflare.com:3478' }
          ],
          iceTransportPolicy: 'relay', // Force TURN relay for Cloudflare
          bundlePolicy: 'max-bundle'
        };

        pc = new RTCPeerConnection(config);

        // Handle incoming tracks
        pc.ontrack = (event) => {
          log('Received track: ' + event.track.kind);
          if (event.track.kind === 'video') {
            video.srcObject = event.streams[0];
          }
        };

        // Handle ICE candidates
        pc.onicecandidate = async (event) => {
          if (event.candidate) {
            log('ICE candidate: ' + event.candidate.candidate.substring(0, 50));
            await sendIceCandidate(event.candidate);
          }
        };

        // Monitor ICE connection
        pc.oniceconnectionstatechange = () => {
          log('ICE connection state: ' + pc.iceConnectionState);
          updateStatus(iceStatus, pc.iceConnectionState, 
            pc.iceConnectionState === 'connected' ? 'connected' : 'warning');
        };

        pc.onconnectionstatechange = () => {
          log('Connection state: ' + pc.connectionState);
          if (pc.connectionState === 'connected') {
            updateStatus(connStatus, 'Connected', 'connected');
          } else if (pc.connectionState === 'failed') {
            updateStatus(connStatus, 'Failed', 'disconnected');
          }
        };

        // Create data channel for controls
        dataChannel = pc.createDataChannel('control');
        
        dataChannel.onopen = () => {
          log('Data channel opened');
          updateStatus(dcStatus, 'Open', 'connected');
        };

        dataChannel.onclose = () => {
          log('Data channel closed');
          updateStatus(dcStatus, 'Closed', 'disconnected');
        };

        dataChannel.onerror = (error) => {
          log('Data channel error: ' + error);
          updateStatus(dcStatus, 'Error', 'disconnected');
        };

        dataChannel.onmessage = (event) => {
          log('Received: ' + event.data);
        };

        // Add transceiver for receiving video
        pc.addTransceiver('video', { direction: 'recvonly' });

        // Create offer
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        // Send offer to Cloudflare and get answer
        log('Sending offer to Cloudflare...');
        const answer = await sendOfferToCloudflare(offer);
        
        if (answer) {
          await pc.setRemoteDescription(new RTCSessionDescription(answer));
          log('Remote description set');
          updateStatus(connStatus, 'Waiting for video...', 'warning');
        }

      } catch (error) {
        log('Error: ' + error);
        updateStatus(connStatus, 'Error: ' + error.message, 'disconnected');
      }
    }

    async function sendOfferToCloudflare(offer) {
      const url = `https://rtc.live.cloudflare.com/v1/apps/${appId}/sessions/${sessionId}/renegotiate`;
      
      try {
        const response = await fetch(url, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            sessionDescription: {
              type: offer.type,
              sdp: offer.sdp
            }
          })
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        }

        const data = await response.json();
        log('Got answer from Cloudflare');
        
        return {
          type: data.sessionDescription.type,
          sdp: data.sessionDescription.sdp
        };
      } catch (error) {
        log('Error sending offer: ' + error);
        throw error;
      }
    }

    async function sendIceCandidate(candidate) {
      if (!appId || !sessionId) return;

      const url = `https://rtc.live.cloudflare.com/v1/apps/${appId}/sessions/${sessionId}/tracks/new`;
      
      try {
        await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            iceCandidate: {
              candidate: candidate.candidate,
              sdpMLineIndex: candidate.sdpMLineIndex,
              sdpMid: candidate.sdpMid
            }
          })
        });
      } catch (error) {
        log('Error sending ICE candidate: ' + error);
      }
    }

    function sendControl() {
      if (!dataChannel || dataChannel.readyState !== 'open') {
        return;
      }

      const control = {
        throttle: parseFloat(throttleInput.value),
        steer: parseFloat(steerInput.value),
        flags: 0,
        t: Date.now()
      };

      dataChannel.send(JSON.stringify(control));
      lastControl.textContent = JSON.stringify(control);
    }

    // Event listeners
    connectBtn.addEventListener('click', connectToCloudflare);

    throttleInput.addEventListener('input', (e) => {
      throttleVal.textContent = e.target.value;
      sendControl();
    });

    steerInput.addEventListener('input', (e) => {
      steerVal.textContent = e.target.value;
      sendControl();
    });

    stopBtn.addEventListener('click', () => {
      throttleInput.value = 0;
      steerInput.value = 0;
      throttleVal.textContent = '0.0';
      steerVal.textContent = '0.0';
      sendControl();
    });

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        throttleInput.value = Math.min(1, parseFloat(throttleInput.value) + 0.1);
        throttleVal.textContent = throttleInput.value;
        sendControl();
      } else if (e.key === 'ArrowDown') {
        throttleInput.value = Math.max(-1, parseFloat(throttleInput.value) - 0.1);
        throttleVal.textContent = throttleInput.value;
        sendControl();
      } else if (e.key === 'ArrowLeft') {
        steerInput.value = Math.max(-1, parseFloat(steerInput.value) - 0.1);
        steerVal.textContent = steerInput.value;
        sendControl();
      } else if (e.key === 'ArrowRight') {
        steerInput.value = Math.min(1, parseFloat(steerInput.value) + 0.1);
        steerVal.textContent = steerInput.value;
        sendControl();
      } else if (e.key === ' ') {
        e.preventDefault();
        stopBtn.click();
      }
    });

    log('Ready - Enter Cloudflare credentials and Session ID from car');
  </script>
</body>
</html>
