<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>RC WebRTC PoC</title>
  <style>
    body { font-family: sans-serif; margin: 16px; }
    video { width: 100%; max-width: 900px; background: #111; }
    .row { margin: 8px 0; }
    input { padding: 6px; }
    button { padding: 8px 12px; }
    pre { background:#f5f5f5; padding:10px; overflow:auto; }
  </style>
</head>
<body>
  <h2>RC WebRTC PoC</h2>

  <div class="row">
    Room: <input id="room" value="test1"/>
    Signaling URL: <input id="wsurl" style="width:380px" value="wss://79-76-127-159.nip.io/"/>
    <button id="connect">Connect (Manual WebRTC)</button>
  </div>

  <video id="v" autoplay playsinline controls muted></video>

  <div class="row">
    Sterowanie: <b>W/S</b> gaz +/-, <b>Space</b> stop.
  </div>

  <div class="row">
    Cloudflare App ID: <span id="cf-app">(loading)</span> | Token: <span id="cf-token">(hidden)</span>
  </div>

  <h3>Cloudflare Realtime SFU</h3>
  <div class="row">
    Room ID: <input id="room-cf" value="test-room-1" />
    <button id="join-cf">Join Room</button>
  </div>

  <video id="video-cf" autoplay playsinline controls muted style="width: 100%; max-width: 900px; background: #111; margin: 10px 0;"></video>

  <h3>Manual WebRTC (Legacy)</h3>

  <pre id="log"></pre>

<script src="https://cdn.jsdelivr.net/npm/@cloudflare/realtime-sdk@0.1/dist/realtime.min.js"></script>

<script>
const logEl = document.getElementById("log");
const videoEl = document.getElementById("v");
const videoCfEl = document.getElementById("video-cf");

function log(...a){ logEl.textContent += a.join(" ") + "\n"; }

let ws, pc, dc;
let cfAppId = "";
let cfToken = "";
let cfSession = null;

async function loadConfig() {
  try {
    const res = await fetch("/config");
    const cfg = await res.json();
    cfAppId = cfg.appId || "";
    if (cfg.hasToken) cfToken = cfg.token || "";
    document.getElementById("cf-app").textContent = cfAppId || "(none)";
    document.getElementById("cf-token").textContent = cfg.hasToken ? "(from env)" : "(not set)";
    log("Cloudflare config loaded");
  } catch (e) {
    log("Failed to load /config", e);
  }
}

// ===== CLOUDFLARE REALTIME SFU =====
async function joinCfRoom() {
  if (!cfAppId || !cfToken) {
    log("ERROR: No CF AppID or Token");
    return;
  }

  const roomId = document.getElementById("room-cf").value.trim();
  if (!roomId) {
    log("ERROR: Room ID empty");
    return;
  }

  try {
    log("Joining CF Realtime room:", roomId);

    // Inicjalizuj sesję Cloudflare Realtime
    cfSession = new window.Realtime({
      appId: cfAppId,
      token: cfToken
    });

    // Dołącz do pokoju
    const room = await cfSession.joinRoom(roomId, {
      profile: "subscriber" // subscriber = tylko odbieranie
    });

    log("Joined room:", roomId);

    // Subskrybuj na videopublishera
    room.onpublishedtrack = async (event) => {
      log("New track published:", event.track.kind);
      if (event.track.kind === "video") {
        // Dodaj track do wideo elementu
        const stream = new MediaStream([event.track]);
        videoCfEl.srcObject = stream;
        log("Playing video from publisher");
      }
    };

    log("CF Realtime setup complete");
  } catch (e) {
    log("CF join error:", e.message);
  }
}

document.getElementById("join-cf").onclick = joinCfRoom;

// ===== LEGACY MANUAL WEBRTC =====
<script>
const logEl = document.getElementById("log");
const videoEl = document.getElementById("v");
function log(...a){ logEl.textContent += a.join(" ") + "\n"; }

let ws, pc, dc;


function makePc() {
  // Konfiguracja TURN servera dla relay połączeń
  // TURN jest niezbędny gdy klienci są za NAT/firewall
  // i nie mogą się połączyć bezpośrednio (host/srflx)
  const iceServers = [
    {
      // Używamy tylko TURN (bez STUN), serwer automatycznie wybierze UDP/TCP
      // Port 3478 = standardowy port TURN (UDP/TCP)
      // Port 5349 = TURN over TLS (wyłączony dla uproszczenia)
      urls: ["turn:79-76-127-159.nip.io:3478"],
      username: "pocuser",
      credential: "pocpass"
    }
  ];

  pc = new RTCPeerConnection({ 
    iceServers: iceServers,
    // iceTransportPolicy: "relay" wymusza używanie TYLKO TURN relay
    // (ignoruje host i srflx candidates) - dobre do testowania TURN
    // Zmień na "all" aby pozwolić na wszystkie typy połączeń
    iceTransportPolicy: "relay"
  });
  
  // Flagi do obsługi kolejkowania ICE candidates
  pc.remoteDescriptionPending = false;
  pc.iceCandidateQueue = [];

  // Firefox wymaga jawnego transceiver dla odbierania video
  if (navigator.userAgent.includes("Firefox")) {
    pc.addTransceiver("video", { direction: "recvonly" });
  }

  pc.ontrack = (ev) => {
    log("ontrack");
    videoEl.srcObject = ev.streams[0];
  };

  pc.ondatachannel = (ev) => {
    dc = ev.channel;
    dc.onopen = () => log("DataChannel open");
    dc.onmessage = (e) => log("DC msg:", e.data);
  };

  pc.onicecandidate = (ev) => {
    if (ev.candidate) {
      const c = ev.candidate;
      const type = c.type || "unknown";
      const protocol = c.protocol || "?";
      const address = c.address || c.candidate.split(" ")[4] || "?";
      log(`Local ICE [${type}/${protocol}]: ${address} - ${c.candidate.substring(0, 80)}...`);
      ws.send(JSON.stringify({ type: "ice", candidate: ev.candidate }));
    } else {
      log("ICE gathering complete");
    }
  };

  pc.onconnectionstatechange = () => log("pc connectionState:", pc.connectionState);
  pc.oniceconnectionstatechange = () => log("pc iceConnectionState:", pc.iceConnectionState);
}

async function startAsViewer() {
  // Czekamy na offer od car
}

async function handleOffer(sdp) {
  pc.remoteDescriptionPending = true;
  await pc.setRemoteDescription(sdp);
  pc.remoteDescriptionPending = false;
  
  // Create answer
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  ws.send(JSON.stringify({ type: "sdp", sdp: pc.localDescription }));
  
  // Process queued ICE candidates
  log("Processing " + pc.iceCandidateQueue.length + " queued ICE candidates");
  while (pc.iceCandidateQueue.length > 0) {
    const candidate = pc.iceCandidateQueue.shift();
    try {
      await pc.addIceCandidate(candidate);
    } catch (e) {
      log("Error adding queued candidate:", e.message);
    }
  }
}

document.getElementById("connect").onclick = async () => {
  const roomId = document.getElementById("room").value.trim();
  const wsurl = document.getElementById("wsurl").value.trim();

  ws = new WebSocket(wsurl);

  ws.onopen = async () => {
    log("WS open");
    ws.send(JSON.stringify({ type: "join", roomId, role: "ui" }));
    // wyślij token Cloudflare do auta/UI w razie potrzeby
    if (cfAppId || cfToken) {
      ws.send(JSON.stringify({ type: "cf-auth", appId: cfAppId, token: cfToken }));
    }
    makePc();
    await startAsViewer();
  };

  ws.onmessage = async (ev) => {
    const msg = JSON.parse(ev.data);

    if (msg.type === "sdp") {
      if (msg.sdp.type === "offer") {
        log("Got SDP offer");
        await handleOffer(msg.sdp);
      }
    }

    if (msg.type === "cf-auth") {
      if (msg.appId && !cfAppId) cfAppId = msg.appId;
      if (msg.token && !cfToken) cfToken = msg.token;
      log("Received cf-auth (appId only logged):", cfAppId);
      return;
    }

    if (msg.type === "ice" && msg.candidate) {
      // Queue candidates until remote description is set
      if (pc.remoteDescriptionPending) {
        log("Queuing ICE candidate (remote desc pending)");
        pc.iceCandidateQueue.push(msg.candidate);
      } else if (!pc.remoteDescription) {
        // Kolejkuj kandydata jeśli remote description jeszcze nie istnieje
        log("Queuing ICE candidate (no remote description yet)");
        pc.iceCandidateQueue.push(msg.candidate);
      } else {
        // Remote description ustawiony - możemy dodawać kandydatów bezpośrednio
        const candStr = msg.candidate.candidate ? msg.candidate.candidate.substring(0, 60) : "empty";
        log("Adding remote ICE candidate:", candStr + "...");
        try {
          // Dodaj kandydata do RTCPeerConnection
          // Przegląda sprawdzi czy kandydat jest kompatybilny i spróbuje połączenia
          await pc.addIceCandidate(msg.candidate);
          log("✓ Candidate added successfully");
        } catch (e) {
          // Błąd może wystąpić gdy:
          // - Format kandydata jest nieprawidłowy
          // - iceTransportPolicy="relay" odrzuca host/srflx candidates
          // - Kandydat nie pasuje do SDP
          log("✗ addIceCandidate error:", e.message);
        }
      }
    }
  };

  ws.onclose = () => log("WS closed");
  ws.onerror = (e) => log("WS error", e);
};

let throttle = 0;   // -1..1 (W/S)
let steering = 0;   // -1..1 (A/D)

const keys = { w:false, a:false, s:false, d:false };

// Parametry "feelingu" sterowania
const SEND_HZ = 50;
const DT = 1 / SEND_HZ;

// Jak szybko narasta przy trzymaniu klawisza (na sekundę)
const THROTTLE_RATE = 1.6; // 0..1 w ~0.6s
const STEER_RATE    = 2.8; // skręt szybciej

// jak szybko wraca do zera po puszczeniu (na sekundę)
const THROTTLE_RETURN = 2.2;
const STEER_RETURN    = 4.0;

function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

function approachZero(v, amount) {
  if (v > 0) return Math.max(0, v - amount);
  if (v < 0) return Math.min(0, v + amount);
  return 0;
}

function sendControl() {
  if (!dc || dc.readyState !== "open") return;
  dc.send(JSON.stringify({ t: Date.now(), throttle, steering }));
}

// tick sterowania (płynne)
setInterval(() => {
  // throttle
  if (keys.w) throttle += THROTTLE_RATE * DT;
  if (keys.s) throttle -= THROTTLE_RATE * DT;
  if (!keys.w && !keys.s) throttle = approachZero(throttle, THROTTLE_RETURN * DT);

  // steering
  if (keys.d) steering += STEER_RATE * DT;
  if (keys.a) steering -= STEER_RATE * DT;
  if (!keys.a && !keys.d) steering = approachZero(steering, STEER_RETURN * DT);

  throttle = clamp(throttle, -1, 1);
  steering = clamp(steering, -1, 1);

  sendControl();
}, 1000 / SEND_HZ);

// key handling
window.addEventListener("keydown", (e) => {
  if (e.code === "KeyW") keys.w = true;
  if (e.code === "KeyS") keys.s = true;
  if (e.code === "KeyA") keys.a = true;
  if (e.code === "KeyD") keys.d = true;

  if (e.code === "Space") {
    throttle = 0;
    steering = 0;
    keys.w = keys.a = keys.s = keys.d = false;
    sendControl();
    log("STOP throttle:", throttle.toFixed(2), "steering:", steering.toFixed(2));
  }
});

window.addEventListener("keyup", (e) => {
  if (e.code === "KeyW") keys.w = false;
  if (e.code === "KeyS") keys.s = false;
  if (e.code === "KeyA") keys.a = false;
  if (e.code === "KeyD") keys.d = false;
});

// opcjonalnie: log co 200ms, żeby nie spamować
setInterval(() => {
  log("throttle:", throttle.toFixed(2), "steering:", steering.toFixed(2));
}, 10000);

// start
loadConfig();

</script>
</body>
</html>
