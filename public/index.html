<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8" />
	<title>CF Realtime Viewer</title>
	<style>
		body { font-family: sans-serif; margin: 1rem; }
		label { display: block; margin: 0.5rem 0 0.2rem; }
		input { width: 100%; padding: 0.4rem; }
		button { margin-top: 0.8rem; padding: 0.5rem 1rem; }
		video { width: 100%; max-width: 960px; margin-top: 1rem; background: #000; }
	</style>
</head>
<body>
	<h1>Cloudflare Realtime (SFU) – podgląd</h1>
	<label>Signaling URL (wss://... z realtime-examples)</label>
	<input id="wsUrl" placeholder="wss://your-worker.example.workers.dev/realtime" />
	<label>Bearer token (np. z Worker lub secrets)</label>
	<input id="token" placeholder="cf_realtime_token" />
	<label>Room</label>
	<input id="room" value="car-stream" />
	<button id="connect">Połącz</button>
	<video id="remoteVideo" playsinline autoplay muted></video>
	<pre id="log"></pre>

	<script>
		const log = (msg) => {
			const el = document.getElementById('log');
			el.textContent += `${new Date().toISOString()} ${msg}\n`;
		};

		document.getElementById('connect').onclick = async () => {
			const wsUrl = document.getElementById('wsUrl').value.trim();
			const token = document.getElementById('token').value.trim();
			const room = document.getElementById('room').value.trim();
			if (!wsUrl || !token || !room) {
				log('Uzupełnij wsUrl/token/room');
				return;
			}

			const pc = new RTCPeerConnection({
				iceServers: [{ urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302'] }]
			});

			pc.ontrack = (ev) => {
				if (ev.streams && ev.streams[0]) {
					document.getElementById('remoteVideo').srcObject = ev.streams[0];
					log('Track otrzymany');
				}
			};

			pc.onicecandidate = async (ev) => {
				if (ev.candidate) return; // trickle disabled; send once complete
				await sendOffer();
			};

			const ws = new WebSocket(wsUrl, []);
			ws.onopen = () => {
				ws.send(JSON.stringify({ type: 'join', room, token }));
				log('WS connected');
			};
			ws.onmessage = async (ev) => {
				const msg = JSON.parse(ev.data);
				if (msg.type === 'answer') {
					await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: msg.sdp }));
					log('Remote answer ustawiony');
				} else if (msg.type === 'candidate') {
					if (msg.candidate) {
						try { await pc.addIceCandidate(msg.candidate); } catch (e) { log(e.toString()); }
					}
				} else {
					log(`Msg: ${ev.data}`);
				}
			};
			ws.onerror = (err) => log(`WS error: ${err.message || err}`);

			const sendOffer = async () => {
				const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
				await pc.setLocalDescription(offer);
				ws.send(JSON.stringify({ type: 'offer', room, token, sdp: offer.sdp }));
				log('Offer wysłany');
			};
		};
	</script>
</body>
</html>
