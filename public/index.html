<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RC Car Control - Cloudflare SFU</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
    }
    #container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #f48120;
    }
    #video {
      width: 100%;
      max-width: 640px;
      background: #000;
      display: block;
      margin: 0 auto 20px;
    }
    #controls {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .control-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      color: #f48120;
    }
    input[type="range"] {
      width: 100%;
    }
    button {
      background: #f48120;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      margin-right: 10px;
    }
    button:hover {
      background: #d66d0f;
    }
    button:disabled {
      background: #555;
      cursor: not-allowed;
    }
    #status {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
    }
    .status-line {
      margin: 5px 0;
    }
    .connected { color: #4caf50; }
    .disconnected { color: #f44336; }
    .warning { color: #ff9800; }
    #config {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      background: #1a1a1a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1>🚗 RC Car Control - Cloudflare SFU</h1>
    
    <div id="config">
      <h3>Connect to Car Stream</h3>
      <div class="control-group">
        <label>Session ID (from car logs):</label>
        <input type="text" id="sessionId" placeholder="paste-session-id-here">
      </div>
      <p style="color: #888; font-size: 12px;">
        The car creates a Cloudflare session. Paste the Session ID here.<br>
        Note: You'll need to add new tracks using the Cloudflare API with auth.
      </p>
      <button id="connectBtn">Connect to Stream</button>
    </div>

    <video id="video" autoplay playsinline muted></video>
    
    <div id="controls">
      <h3>Controls</h3>
      <div class="control-group">
        <label>Throttle: <span id="throttleVal">0.0</span></label>
        <input type="range" id="throttle" min="-1" max="1" step="0.1" value="0">
      </div>
      <div class="control-group">
        <label>Steering: <span id="steerVal">0.0</span></label>
        <input type="range" id="steer" min="-1" max="1" step="0.1" value="0">
      </div>
      <button id="stopBtn">Emergency Stop</button>
    </div>

    <div id="status">
      <div class="status-line">Status: <span id="connStatus" class="disconnected">Disconnected</span></div>
      <div class="status-line">ICE: <span id="iceStatus">-</span></div>
      <div class="status-line">Data Channel: <span id="dcStatus">-</span></div>
      <div class="status-line">Last Control: <span id="lastControl">-</span></div>
    </div>
  </div>

  <script>
    // Cloudflare Realtime SFU client
    let pc = null;
    let dataChannel = null;
    let sessionId = null;
    let appId = null;

    const video = document.getElementById('video');
    const throttleInput = document.getElementById('throttle');
    const steerInput = document.getElementById('steer');
    const throttleVal = document.getElementById('throttleVal');
    const steerVal = document.getElementById('steerVal');
    const stopBtn = document.getElementById('stopBtn');
    const connectBtn = document.getElementById('connectBtn');
    const sessionIdInput = document.getElementById('sessionId');

    // Status elements
    const connStatus = document.getElementById('connStatus');
    const iceStatus = document.getElementById('iceStatus');
    const dcStatus = document.getElementById('dcStatus');
    const lastControl = document.getElementById('lastControl');

    function log(msg) {
      console.log(`[${new Date().toLocaleTimeString()}] ${msg}`);
    }

    function updateStatus(element, text, className) {
      element.textContent = text;
      element.className = className;
    }

    // Get config from server (App ID only, no token needed for browser)
    async function loadConfig() {
      try {
        const response = await fetch('/config');
        const config = await response.json();
        appId = config.appId;
        log('Loaded App ID: ' + appId);
        return true;
      } catch (error) {
        log('Error loading config: ' + error);
        alert('Failed to load Cloudflare config from server');
        return false;
      }
    }

    async function connectToCloudflare() {
      sessionId = sessionIdInput.value.trim();

      if (!sessionId) {
        alert('Please enter the Session ID from the car');
        return;
      }

      if (!appId) {
        if (!await loadConfig()) {
          return;
        }
      }

      log('Connecting to Cloudflare SFU session: ' + sessionId);
      updateStatus(connStatus, 'Connecting...', 'warning');

      try {
        // Create RTCPeerConnection
        const config = {
          iceServers: [
            { urls: 'stun:stun.cloudflare.com:3478' }
          ],
          bundlePolicy: 'max-bundle'
        };

        pc = new RTCPeerConnection(config);

        // Handle incoming tracks
        pc.ontrack = (event) => {
          log('Received track: ' + event.track.kind);
          if (event.track.kind === 'video') {
            video.srcObject = event.streams[0];
          }
        };

        // Handle ICE candidates
        pc.onicecandidate = async (event) => {
          if (event.candidate) {
            log('ICE candidate generated: ' + event.candidate.candidate.substring(0, 50));
          } else {
            log('ICE gathering complete');
          }
        };

        // Monitor states
        pc.oniceconnectionstatechange = () => {
          log('ICE connection state: ' + pc.iceConnectionState);
          updateStatus(iceStatus, pc.iceConnectionState, 
            pc.iceConnectionState === 'connected' ? 'connected' : 'warning');
        };

        pc.onconnectionstatechange = () => {
          log('Connection state: ' + pc.connectionState);
          if (pc.connectionState === 'connected') {
            updateStatus(connStatus, 'Connected', 'connected');
          } else if (pc.connectionState === 'failed') {
            updateStatus(connStatus, 'Failed', 'disconnected');
          }
        };

        // Handle data channel from car
        pc.ondatachannel = (event) => {
          dataChannel = event.channel;
          log('Data channel received: ' + dataChannel.label);
          
          dataChannel.onopen = () => {
            log('Data channel opened');
            updateStatus(dcStatus, 'Open', 'connected');
          };

          dataChannel.onclose = () => {
            log('Data channel closed');
            updateStatus(dcStatus, 'Closed', 'disconnected');
          };

          dataChannel.onerror = (error) => {
            log('Data channel error: ' + error);
          };

          dataChannel.onmessage = (event) => {
            log('Received: ' + event.data);
          };
        };

        // Add transceiver for receiving video
        pc.addTransceiver('video', { direction: 'recvonly' });

        // Create offer for pulling from session
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);

        log('Created offer, requesting new track from session...');
        
        // Request to pull track from existing session
        // This creates a NEW pull track on the session
        const answer = await createNewPullTrack(offer);
        
        if (answer) {
          await pc.setRemoteDescription(new RTCSessionDescription(answer));
          log('Successfully connected to track');
          updateStatus(connStatus, 'Connected - waiting for video...', 'connected');
        }

      } catch (error) {
        log('Error: ' + error);
        alert('Connection failed: ' + error.message + '\n\nNote: Browser needs server-side auth to join. Consider using WebSocket signaling instead.');
        updateStatus(connStatus, 'Error: ' + error.message, 'disconnected');
      }
    }

    async function createNewPullTrack(offer) {
      // Use backend proxy to join session (backend has auth token)
      try {
        const response = await fetch('/api/join-session', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            sessionId: sessionId,
            offer: {
              type: offer.type,
              sdp: offer.sdp
            }
          })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(`Server error: ${errorData.error}`);
        }

        const data = await response.json();
        log('Got answer from server proxy');
        
        return data.answer;
      } catch (error) {
        log('Error via proxy: ' + error);
        throw error;
      }
    }

    function sendControl() {
      if (!dataChannel || dataChannel.readyState !== 'open') {
        return;
      }

      const control = {
        throttle: parseFloat(throttleInput.value),
        steer: parseFloat(steerInput.value),
        flags: 0,
        t: Date.now()
      };

      dataChannel.send(JSON.stringify(control));
      lastControl.textContent = JSON.stringify(control);
    }

    // Event listeners
    connectBtn.addEventListener('click', connectToCloudflare);

    throttleInput.addEventListener('input', (e) => {
      throttleVal.textContent = e.target.value;
      sendControl();
    });

    steerInput.addEventListener('input', (e) => {
      steerVal.textContent = e.target.value;
      sendControl();
    });

    stopBtn.addEventListener('click', () => {
      throttleInput.value = 0;
      steerInput.value = 0;
      throttleVal.textContent = '0.0';
      steerVal.textContent = '0.0';
      sendControl();
    });

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp') {
        throttleInput.value = Math.min(1, parseFloat(throttleInput.value) + 0.1);
        throttleVal.textContent = throttleInput.value;
        sendControl();
      } else if (e.key === 'ArrowDown') {
        throttleInput.value = Math.max(-1, parseFloat(throttleInput.value) - 0.1);
        throttleVal.textContent = throttleInput.value;
        sendControl();
      } else if (e.key === 'ArrowLeft') {
        steerInput.value = Math.max(-1, parseFloat(steerInput.value) - 0.1);
        steerVal.textContent = steerInput.value;
        sendControl();
      } else if (e.key === 'ArrowRight') {
        steerInput.value = Math.min(1, parseFloat(steerInput.value) + 0.1);
        steerVal.textContent = steerInput.value;
        sendControl();
      } else if (e.key === ' ') {
        e.preventDefault();
        stopBtn.click();
      }
    });

    // Load config on startup
    loadConfig();
    log('Ready - paste Session ID from car and click Connect');
  </script>
</body>
</html>
