<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPi Car Camera Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
        }
        input {
            flex: 1;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            border-radius: 4px;
        }
        button {
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            min-width: 120px;
        }
        button:hover {
            background: #0051cc;
        }
        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 1024px;
            margin: 0 auto;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 4px;
            border-left: 4px solid #0070f3;
        }
        .status.error {
            border-left-color: #ff0000;
        }
        .status.success {
            border-left-color: #00ff00;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 RPi Car Camera Stream</h1>
        
        <div class="controls">
            <input type="text" id="appId" placeholder="Cloudflare App ID" />
            <input type="text" id="appSecret" placeholder="Cloudflare App Secret" />
            <input type="text" id="sessionId" placeholder="Session ID (from RPi)" />
            <button id="connectBtn" onclick="connect()">Connect</button>
            <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
        </div>

        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline muted></video>
        </div>

        <div id="status" class="status">
            Waiting to connect...
        </div>
    </div>

    <script>
        let peerConnection = null;
        let sessionIdValue = null;

        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
            console.log(message);
        }

        function extractMidFromSDP(sdp, trackKind) {
            const lines = sdp.split('\n');
            let currentMid = null;
            let currentKind = null;
            
            for (const line of lines) {
                if (line.startsWith('a=mid:')) {
                    currentMid = line.split(':')[1].trim();
                } else if (line.startsWith('m=')) {
                    currentKind = line.split(' ')[0].substring(2);
                    if (currentKind === trackKind && currentMid) {
                        return currentMid;
                    }
                }
            }
            return currentMid;
        }

        async function connect() {
            const appId = document.getElementById('appId').value.trim();
            const appSecret = document.getElementById('appSecret').value.trim();
            sessionIdValue = document.getElementById('sessionId').value.trim();

            if (!appId || !appSecret || !sessionIdValue) {
                updateStatus('Please fill in all fields', 'error');
                return;
            }

            try {
                document.getElementById('connectBtn').disabled = true;
                updateStatus('Connecting to Cloudflare Calls...');

                peerConnection = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.cloudflare.com:3478' }
                    ],
                    bundlePolicy: 'max-bundle'
                });

                peerConnection.ontrack = (event) => {
                    updateStatus('Receiving video stream...', 'success');
                    console.log('Track received:', event.track.kind);
                    const video = document.getElementById('remoteVideo');
                    if (event.streams && event.streams[0]) {
                        video.srcObject = event.streams[0];
                    }
                };

                peerConnection.onconnectionstatechange = () => {
                    updateStatus(`Connection state: ${peerConnection.connectionState}`);
                    if (peerConnection.connectionState === 'connected') {
                        updateStatus('Connected! Streaming video...', 'success');
                        document.getElementById('disconnectBtn').disabled = false;
                    } else if (peerConnection.connectionState === 'failed' || 
                               peerConnection.connectionState === 'disconnected') {
                        updateStatus('Connection lost', 'error');
                        disconnect();
                    }
                };

                // Add transceiver to receive video
                peerConnection.addTransceiver('video', { direction: 'recvonly' });

                // Create offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                // Wait for ICE gathering
                await new Promise((resolve) => {
                    if (peerConnection.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        const checkState = () => {
                            if (peerConnection.iceGatheringState === 'complete') {
                                peerConnection.removeEventListener('icegatheringstatechange', checkState);
                                resolve();
                            }
                        };
                        peerConnection.addEventListener('icegatheringstatechange', checkState);
                    }
                });

                const videoMid = extractMidFromSDP(peerConnection.localDescription.sdp, 'video');
                console.log('Extracted video mid:', videoMid);
                console.log('Full SDP:', peerConnection.localDescription.sdp);

                if (!videoMid) {
                    throw new Error('Could not extract video mid from SDP');
                }

                // Prepare request payload
                const payload = {
                    sessionDescription: {
                        type: 'offer',
                        sdp: peerConnection.localDescription.sdp
                    },
                    tracks: [
                        {
                            location: 'remote',
                            trackName: 'camera',
                            sessionId: sessionIdValue,
                            mid: videoMid
                        }
                    ]
                };

                console.log('Request URL:', `https://rtc.live.cloudflare.com/v1/apps/${appId}/sessions/${sessionIdValue}/tracks/new`);
                console.log('Request payload:', JSON.stringify(payload, null, 2));

                // Subscribe to the same session - pull remote track
                updateStatus('Subscribing to camera track...');
                const response = await fetch(`https://rtc.live.cloudflare.com/v1/apps/${appId}/sessions/${sessionIdValue}/tracks/new`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${appSecret}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const responseText = await response.text();
                console.log('Response status:', response.status);
                console.log('Response body:', responseText);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status} - ${responseText}`);
                }

                const data = JSON.parse(responseText);
                console.log('Parsed response:', data);

                // Check for errors in tracks
                if (data.tracks && data.tracks[0] && data.tracks[0].errorCode) {
                    console.error('Track error details:', data.tracks[0]);
                    throw new Error(`Track error: ${data.tracks[0].errorDescription} (${data.tracks[0].errorCode})`);
                }

                // Handle renegotiation if required
                if (data.requiresImmediateRenegotiation) {
                    console.log('Renegotiation required');
                    updateStatus('Renegotiating connection...');
                    
                    // Create new offer
                    const newOffer = await peerConnection.createOffer();
                    await peerConnection.setLocalDescription(newOffer);

                    // Wait for ICE gathering
                    await new Promise((resolve) => {
                        if (peerConnection.iceGatheringState === 'complete') {
                            resolve();
                        } else {
                            const checkState = () => {
                                if (peerConnection.iceGatheringState === 'complete') {
                                    peerConnection.removeEventListener('icegatheringstatechange', checkState);
                                    resolve();
                                }
                            };
                            peerConnection.addEventListener('icegatheringstatechange', checkState);
                        }
                    });

                    console.log('Renegotiation SDP:', peerConnection.localDescription.sdp);

                    // Renegotiate
                    const renegResponse = await fetch(`https://rtc.live.cloudflare.com/v1/apps/${appId}/sessions/${sessionIdValue}/renegotiate`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${appSecret}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            sessionDescription: {
                                type: 'offer',
                                sdp: peerConnection.localDescription.sdp
                            }
                        })
                    });

                    const renegText = await renegResponse.text();
                    console.log('Renegotiation response status:', renegResponse.status);
                    console.log('Renegotiation response body:', renegText);

                    if (!renegResponse.ok) {
                        throw new Error(`Renegotiation failed: ${renegResponse.status} - ${renegText}`);
                    }

                    const renegData = JSON.parse(renegText);
                    console.log('Renegotiation parsed response:', renegData);

                    if (renegData.sessionDescription) {
                        await peerConnection.setRemoteDescription({
                            type: renegData.sessionDescription.type,
                            sdp: renegData.sessionDescription.sdp
                        });
                    }
                } else if (data.sessionDescription) {
                    console.log('Setting remote description directly');
                    // Set remote description
                    await peerConnection.setRemoteDescription({
                        type: data.sessionDescription.type,
                        sdp: data.sessionDescription.sdp
                    });
                } else {
                    console.warn('No sessionDescription in response and no renegotiation required');
                }

                updateStatus('Waiting for video stream...', 'success');

            } catch (error) {
                updateStatus(`Error: ${error.message}`, 'error');
                console.error('Connection error:', error);
                document.getElementById('connectBtn').disabled = false;
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
            }
        }

        function disconnect() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            const video = document.getElementById('remoteVideo');
            video.srcObject = null;

            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            updateStatus('Disconnected');
        }

        window.addEventListener('beforeunload', disconnect);
    </script>
</body>
</html>
