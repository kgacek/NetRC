<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPi Car Camera Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input, button {
            padding: 10px;
            font-size: 16px;
        }
        input {
            flex: 1;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            border-radius: 4px;
        }
        button {
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            min-width: 120px;
        }
        button:hover {
            background: #0051cc;
        }
        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 1024px;
            margin: 0 auto;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 4px;
            border-left: 4px solid #0070f3;
        }
        .status.error {
            border-left-color: #ff0000;
        }
        .status.success {
            border-left-color: #00ff00;
        }
        .session-list {
            margin-bottom: 20px;
            padding: 15px;
            background: #2a2a2a;
            border-radius: 4px;
        }
        .session-item {
            padding: 10px;
            margin: 5px 0;
            background: #1a1a1a;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .session-item:hover {
            border-color: #0070f3;
        }
        .session-item.selected {
            border-color: #00ff00;
        }
        .refresh-btn {
            min-width: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 RPi Car Camera Stream</h1>
        
        <div class="controls">
            <input type="text" id="appId" placeholder="Cloudflare App ID" />
            <input type="text" id="appSecret" placeholder="Cloudflare App Secret" />
            <input type="text" id="signalingServer" placeholder="Signaling Server" value="https://79-76-127-159.nip.io" />
            <button class="refresh-btn" onclick="loadSessions()">Refresh Sessions</button>
        </div>

        <div class="session-list" id="sessionList" style="display: none;">
            <h3>Available RPi Sessions:</h3>
            <div id="sessions"></div>
        </div>

        <div class="controls">
            <input type="text" id="sessionId" placeholder="RPi Session ID (or select from list)" />
            <button id="connectBtn" onclick="connect()">Connect</button>
            <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
        </div>

        <div class="video-container">
            <video id="remoteVideo" autoplay playsinline></video>
        </div>

        <div id="status" class="status">
            Waiting to connect...
        </div>
        
        <div class="controls" style="margin-top: 20px; text-align: center; color: #888;">
            <p><strong>Car Controls:</strong> W/S - Forward/Reverse | A/D - Left/Right | SPACE - Emergency Brake | R - Reset</p>
        </div>
    </div>

    <script>
        let peerConnection = null;
        let mySessionId = null;
        let selectedSessionId = null;
        let controlChannel = null;
        
        // Car control state
        let throttle = 0;
        let steer = 0;
        let keys = {
            'w': false,
            's': false,
            'a': false,
            'd': false
        };
        
        // Control parameters
        const THROTTLE_ACCEL = 5;
        const THROTTLE_DECEL = 20;
        const STEER_SPEED = 70;
        const STEER_RETURN_SPEED = 80;
        const MAX_THROTTLE = 300;
        const MAX_STEER = 1000;

        function updateStatus(message, type = 'info') {
            const statusEl = document.getElementById('status');
            statusEl.textContent = message;
            statusEl.className = 'status ' + type;
            console.log(message);
        }

        async function loadSessions() {
            const signalingServer = document.getElementById('signalingServer').value.trim();
            
            if (!signalingServer) {
                updateStatus('Please enter signaling server URL', 'error');
                return;
            }

            try {
                updateStatus('Loading available sessions...');
                
                const response = await fetch(`${signalingServer}/api/sessions`);
                
                if (!response.ok) {
                    throw new Error(`Failed to load sessions: ${response.status}`);
                }

                const sessions = await response.json();
                console.log('Available sessions:', sessions);

                const sessionsDiv = document.getElementById('sessions');
                const sessionListDiv = document.getElementById('sessionList');

                if (sessions.length === 0) {
                    sessionsDiv.innerHTML = '<p style="color: #888;">No active sessions found. Make sure RPi is streaming.</p>';
                    sessionListDiv.style.display = 'block';
                    updateStatus('No sessions found', 'error');
                    return;
                }

                sessionsDiv.innerHTML = sessions.map(session => {
                    const age = Math.floor((Date.now() / 1000) - session.timestamp);
                    return `
                        <div class="session-item" onclick="selectSession('${session.sessionId}')">
                            <strong>Session ID:</strong> ${session.sessionId.substring(0, 16)}...<br>
                            <small>Active since: ${age}s ago</small>
                        </div>
                    `;
                }).join('');

                sessionListDiv.style.display = 'block';
                updateStatus(`Found ${sessions.length} active session(s)`, 'success');

            } catch (error) {
                updateStatus(`Error loading sessions: ${error.message}`, 'error');
                console.error('Load sessions error:', error);
            }
        }

        function selectSession(sessionId) {
            selectedSessionId = sessionId;
            document.getElementById('sessionId').value = sessionId;
            
            // Visual feedback
            document.querySelectorAll('.session-item').forEach(item => {
                item.classList.remove('selected');
            });
            event.target.closest('.session-item').classList.add('selected');
            
            updateStatus('Session selected. Click Connect to start streaming.', 'success');
        }
        
        // Car control functions
        function updateCarControl() {
            // === THROTTLE ===
            if (keys['w'] && !keys['s']) {
                throttle = Math.max(throttle - THROTTLE_ACCEL - 40, -MAX_THROTTLE);
            } else if (keys['s'] && !keys['w']) {
                throttle = Math.min(40 + throttle + THROTTLE_ACCEL, MAX_THROTTLE);
            } else {
                // Decelerate to zero
                if (throttle > 0) {
                    throttle = Math.max(0, throttle - THROTTLE_DECEL);
                } else if (throttle < 0) {
                    throttle = Math.min(0, throttle + THROTTLE_DECEL);
                }
            }
            
            // === STEERING ===
            if (keys['a'] && !keys['d']) {
                steer = Math.min(steer + STEER_SPEED, MAX_STEER);
            } else if (keys['d'] && !keys['a']) {
                steer = Math.max(steer - STEER_SPEED, -MAX_STEER);
            } else {
                // Return to center
                if (steer > 0) {
                    steer = Math.max(0, steer - STEER_RETURN_SPEED);
                } else if (steer < 0) {
                    steer = Math.min(0, steer + STEER_RETURN_SPEED);
                }
            }
            
            // Send control command via DataChannel
            if (controlChannel && controlChannel.readyState === 'open') {
                const command = JSON.stringify({
                    throttle: Math.round(throttle),
                    steer: Math.round(steer)
                });
                controlChannel.send(command);
            }
        }
        
        // Keyboard event handlers
        function handleKeyDown(e) {
            const key = e.key.toLowerCase();
            
            if (key === 'w') keys['w'] = true;
            else if (key === 's') keys['s'] = true;
            else if (key === 'a') keys['a'] = true;
            else if (key === 'd') keys['d'] = true;
            else if (key === ' ') {
                e.preventDefault();
                // Emergency brake
                throttle = 0;
                steer = 0;
                keys = { 'w': false, 's': false, 'a': false, 'd': false };
            } else if (key === 'r') {
                // Reset
                throttle = 0;
                steer = 0;
                keys = { 'w': false, 's': false, 'a': false, 'd': false };
            }
        }
        
        function handleKeyUp(e) {
            const key = e.key.toLowerCase();
            
            if (key === 'w') keys['w'] = false;
            else if (key === 's') keys['s'] = false;
            else if (key === 'a') keys['a'] = false;
            else if (key === 'd') keys['d'] = false;
        }
        
        // Start control loop
        let controlLoopInterval = null;
        function startControlLoop() {
            if (controlLoopInterval) return;
            
            controlLoopInterval = setInterval(() => {
                updateCarControl();
                updateControlHUD();
            }, 20); // 50Hz
            
            // Add keyboard listeners
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
        }
        
        function stopControlLoop() {
            if (controlLoopInterval) {
                clearInterval(controlLoopInterval);
                controlLoopInterval = null;
            }
            
            window.removeEventListener('keydown', handleKeyDown);
            window.removeEventListener('keyup', handleKeyUp);
            
            // Reset state
            throttle = 0;
            steer = 0;
            keys = { 'w': false, 's': false, 'a': false, 'd': false };
        }
        
        function updateControlHUD() {
            const statusEl = document.getElementById('status');
            
            const thrLabel = throttle > 0 ? 'FWD' : throttle < 0 ? 'REV' : '---';
            const keyW = keys['w'] ? '▲' : '△';
            const keyS = keys['s'] ? '▼' : '▽';
            const keyA = keys['a'] ? '◄' : '◁';
            const keyD = keys['d'] ? '►' : '▷';
            
            const channelStatus = controlChannel && controlChannel.readyState === 'open' ? '🟢' : '🔴';
            
            statusEl.innerHTML = `
                ${channelStatus} Control: [${thrLabel}] Throttle: ${throttle.toFixed(0).padStart(4)} | Steer: ${steer.toFixed(0).padStart(5)} | Keys: [${keyW}${keyS}${keyA}${keyD}]
            `;
            statusEl.className = 'status success';
        }

        async function connect() {
            const appId = document.getElementById('appId').value.trim();
            const appSecret = document.getElementById('appSecret').value.trim();
            const rpiSessionId = document.getElementById('sessionId').value.trim();

            if (!appId || !appSecret || !rpiSessionId) {
                updateStatus('Please fill in all fields', 'error');
                return;
            }

            try {
                document.getElementById('connectBtn').disabled = true;
                updateStatus('Creating viewer session...');

                // Create OUR OWN session (not joining RPi session)
                const createResponse = await fetch(`https://rtc.live.cloudflare.com/v1/apps/${appId}/sessions/new`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${appSecret}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!createResponse.ok) {
                    throw new Error(`Failed to create session: ${createResponse.status}`);
                }

                const sessionData = await createResponse.json();
                mySessionId = sessionData.sessionId;
                console.log('Created viewer session:', mySessionId);

                updateStatus('Connecting to RPi stream...');

                peerConnection = new RTCPeerConnection({
                    iceServers: [
                        { urls: 'stun:stun.cloudflare.com:3478' }
                    ],
                    bundlePolicy: 'max-bundle'
                });

                peerConnection.ontrack = (event) => {
                    updateStatus('Receiving video stream...', 'success');
                    console.log('Track received:', event.track.kind);
                    const video = document.getElementById('remoteVideo');
                    if (event.streams && event.streams[0]) {
                        video.srcObject = event.streams[0];
                        video.play().catch(e => console.error('Play error:', e));
                    }
                };

                peerConnection.onconnectionstatechange = () => {
                    console.log(`Connection state: ${peerConnection.connectionState}`);
                    updateStatus(`Connection state: ${peerConnection.connectionState}`);
                    if (peerConnection.connectionState === 'connected') {
                        updateStatus('Connected! Stream active. Use WASD to control.', 'success');
                        document.getElementById('disconnectBtn').disabled = false;
                    } else if (peerConnection.connectionState === 'failed' || 
                               peerConnection.connectionState === 'closed') {
                        updateStatus('Connection failed or closed', 'error');
                        disconnect();
                    }
                };
                
                // Receive DataChannel from RPi (RPi creates it, we receive it)
                peerConnection.ondatachannel = (event) => {
                    console.log('DataChannel received from RPi:', event.channel.label);
                    controlChannel = event.channel;
                    
                    controlChannel.onopen = () => {
                        console.log('Control DataChannel opened');
                        updateStatus('Control channel ready! Use WASD to control car.', 'success');
                        startControlLoop();
                    };
                    
                    controlChannel.onclose = () => {
                        console.log('Control DataChannel closed');
                        stopControlLoop();
                    };
                    
                    controlChannel.onerror = (error) => {
                        console.error('DataChannel error:', error);
                    };
                };

                // Add transceiver to receive video
                peerConnection.addTransceiver('video', { direction: 'recvonly' });

                // Create offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                // Wait for ICE gathering
                await new Promise((resolve) => {
                    if (peerConnection.iceGatheringState === 'complete') {
                        resolve();
                    } else {
                        const checkState = () => {
                            if (peerConnection.iceGatheringState === 'complete') {
                                peerConnection.removeEventListener('icegatheringstatechange', checkState);
                                resolve();
                            }
                        };
                        peerConnection.addEventListener('icegatheringstatechange', checkState);
                    }
                });

                console.log('Our SDP offer:', peerConnection.localDescription.sdp);

                // Pull video track from RPi session into OUR session
                const pullResponse = await fetch(`https://rtc.live.cloudflare.com/v1/apps/${appId}/sessions/${mySessionId}/tracks/new`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${appSecret}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        sessionDescription: {
                            type: 'offer',
                            sdp: peerConnection.localDescription.sdp
                        },
                        tracks: [
                            {
                                location: 'remote',
                                sessionId: rpiSessionId,  // Pull from RPi session
                                trackName: 'camera',
                                mid: '0'  // Video track is always mid 0 in Cloudflare
                            }
                        ]
                    })
                });

                const pullText = await pullResponse.text();
                console.log('Pull response status:', pullResponse.status);
                console.log('Pull response:', pullText);

                if (!pullResponse.ok) {
                    throw new Error(`Failed to pull track: ${pullResponse.status} - ${pullText}`);
                }

                const pullData = JSON.parse(pullText);
                console.log('Pull data:', pullData);

                // Check for errors
                if (pullData.tracks && pullData.tracks[0] && pullData.tracks[0].errorCode) {
                    throw new Error(`Track error: ${pullData.tracks[0].errorDescription}`);
                }

                if (pullData.sessionDescription) {
                    await peerConnection.setRemoteDescription({
                        type: pullData.sessionDescription.type,
                        sdp: pullData.sessionDescription.sdp
                    });
                    updateStatus('Waiting for video stream...', 'success');
                } else {
                    throw new Error('No session description in response');
                }

            } catch (error) {
                updateStatus(`Error: ${error.message}`, 'error');
                console.error('Connection error:', error);
                document.getElementById('connectBtn').disabled = false;
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
            }
        }

        function disconnect() {
            stopControlLoop();
            
            if (controlChannel) {
                controlChannel.close();
                controlChannel = null;
            }
            
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            const video = document.getElementById('remoteVideo');
            video.srcObject = null;

            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            updateStatus('Disconnected');
        }

        window.addEventListener('beforeunload', disconnect);

        // Auto-load sessions on page load if signaling server is set
        window.addEventListener('load', () => {
            const signalingServer = document.getElementById('signalingServer').value;
            if (signalingServer) {
                setTimeout(loadSessions, 500);
            }
        });
    </script>
</body>
</html>
